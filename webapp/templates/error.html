{% extends "base.html" %}

{% block title %}Error - K-Sites{% endblock %}

{% block content %}
<div class="ks-wrap">
    <div class="text-center py-5">
        <div style="font-size:64px;color:var(--ks-bad);margin-bottom:16px;">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h2 style="margin-bottom:12px;color:var(--ks-fg);">Oops! Something went wrong</h2>
        <p style="color:var(--ks-muted);font-size:17px;margin-bottom:24px;">{{ message }}</p>
        <a href="/" class="ks-btn">
            <i class="fas fa-home me-2"></i>Return to Home
        </a>
    </div>
</div>
{% endblock %}
