name: Deploy the K-Sites website to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install jinja2

      - name: Verify BACKEND_URL is set
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "::error::BACKEND_URL repository variable is not set."
            echo "::error::Go to Settings → Secrets and variables → Actions → Variables and add BACKEND_URL with your backend URL (e.g. https://your-backend.ngrok-free.dev)."
            exit 1
          fi

      - name: Build static site
        run: python tools/build_static_site.py --api-base "${{ vars.BACKEND_URL }}" --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
