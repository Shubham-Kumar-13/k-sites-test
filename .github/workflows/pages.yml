name: Deploy the K-Sites website to GitHub Pages

# The website runs the whole analysis in each visitor's browser, so Pages is all that is needed.
# Besides the pages, the build publishes two sets of data files that the browser reads:
#   kegg-data/       pathway counts per gene (KEGG)
#   evidence-data/   measured knockout evidence (MGI, IMPC, DepMap, gnomAD, GTEx, SGD, ZFIN, FlyBase, WormBase, Alliance, Ensembl)
on:
  push:
    branches: [master, main]
    paths:
      - "webapp/templates/**"
      - "webapp/static/**"
      - "webapp/utils/help_content.py"
      - "tools/build_static_site.py"
      - "tools/build_kegg_data.py"
      - "tools/build_evidence_data.py"
      - "tools/data/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 3 1 * *"   # refresh the KEGG and knockout data on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the builders
        run: pip install jinja2 requests

      - name: Build the static site
        run: python tools/build_static_site.py --out site

      - name: Download the KEGG pathway data
        run: python tools/build_kegg_data.py --out site/kegg-data

      - name: Note the month (the downloaded knockout sources are kept for a month)
        id: month
        run: echo "value=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the downloaded knockout data sources
        uses: actions/cache@v4
        with:
          path: .cache/evidence-sources
          # v2: the ZFIN, FlyBase and WormBase files joined the cache (a cache saved earlier lacks them)
          key: evidence-sources-v2-${{ steps.month.outputs.value }}

      - name: Build the measured knockout evidence
        run: python tools/build_evidence_data.py --out site/evidence-data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
