name: Deploy the K-Sites website to GitHub Pages

# The website runs the whole analysis in each visitor's browser, so Pages is all that is needed.
on:
  push:
    branches: [master, main]
    paths:
      - "webapp/templates/**"
      - "webapp/static/**"
      - "webapp/utils/help_content.py"
      - "tools/build_static_site.py"
      - "tools/build_kegg_data.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 3 1 * *"   # refresh the KEGG pathway data on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the site builder
        run: pip install jinja2 requests

      - name: Build the static site
        run: python tools/build_static_site.py --out site

      - name: Download the KEGG pathway data
        run: python tools/build_kegg_data.py --out site/kegg-data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
